<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>L2 Monitor - Редактор Ротации</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Базовые цвета ТГ с фоллбэком на темную игровую тему */
            --bg-color: var(--tg-theme-bg-color, #1a1b22);
            --text-color: var(--tg-theme-text-color, #e0e0e0);
            --hint-color: var(--tg-theme-hint-color, #8a8a93);
            --surface-color: var(--tg-theme-secondary-bg-color, #24252f);
            /* Игровые акценты (Lineage 2 vibe - золото/синий) */
            --accent-color: var(--tg-theme-button-color, #d4af37); 
            --accent-text: var(--tg-theme-button-text-color, #111);
            --danger-color: #ff453a;
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 13px; color: var(--hint-color); }

        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--hint-color); text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid rgba(138, 138, 147, 0.2);
            border-radius: 8px;
            background-color: var(--surface-color);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
        }
        select:focus, input:focus { border-color: var(--accent-color); }

        .profiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .profile-btn {
            padding: 10px; font-size: 14px; font-weight: 600;
            border: 1px solid rgba(138, 138, 147, 0.2); border-radius: 8px;
            background-color: var(--surface-color); color: var(--text-color);
            cursor: pointer; transition: all 0.2s;
        }
        .profile-btn.active {
            background-color: var(--accent-color); color: var(--accent-text);
            border-color: var(--accent-color); box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
        }

        .skills-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

        .skill-item {
            background-color: var(--surface-color);
            border: 1px solid rgba(138, 138, 147, 0.1);
            border-radius: var(--border-radius);
            padding: 14px; display: flex; align-items: center; gap: 12px;
            animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .skill-number {
            width: 28px; height: 28px; flex-shrink: 0;
            background-color: rgba(138, 138, 147, 0.1); color: var(--hint-color);
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px;
        }

        .skill-content { flex: 1; display: flex; gap: 10px; }
        .skill-input-group { flex: 1; }
        .skill-input-group label { display: block; font-size: 11px; color: var(--hint-color); margin-bottom: 4px; }
        .skill-input-group input, .skill-input-group select { padding: 8px 10px; font-size: 14px; }

        .skill-actions { display: flex; flex-direction: column; gap: 6px; }
        .action-btn {
            width: 32px; height: 32px; border: none; border-radius: 6px;
            background-color: rgba(138, 138, 147, 0.1); color: var(--text-color);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .action-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .action-btn:active { transform: scale(0.92); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .action-btn.delete { background-color: rgba(255, 69, 58, 0.1); color: var(--danger-color); }

        .add-skill-btn {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
            border: 2px dashed rgba(138, 138, 147, 0.3); border-radius: var(--border-radius);
            background-color: transparent; color: var(--text-color);
            cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .add-skill-btn:active { background-color: rgba(138, 138, 147, 0.1); }

        .total-time {
            text-align: center; margin-top: 16px; font-size: 14px; color: var(--hint-color);
            background: var(--surface-color); padding: 10px; border-radius: 8px; font-family: monospace;
        }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--hint-color); }
        .empty-state svg { width: 48px; height: 48px; opacity: 0.5; margin-bottom: 12px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M21 2H3C1.9 2 1 2.9 1 4v16c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 15H9v-2h3v2zm0-4H9V7h3v6zm5 4h-3v-2h3v2zm0-4h-3V7h3v6z"/></svg>
            L2 Rotation
        </h1>
        <p>Настройка макросов кликера</p>
    </div>

    <div class="control-group">
        <label for="character">Персонаж</label>
        <select id="character">
            <option value="main">⚔️ Основной (Main)</option>
            <option value="buffer">🪄 Бафер (Buffer)</option>
        </select>
    </div>

    <div class="control-group">
        <label>Игровой профиль</label>
        <div class="profiles-grid" id="profileGrid">
            <button class="profile-btn active" data-profile="default">Default</button>
            <button class="profile-btn" data-profile="farm">PvE Farm</button>
            <button class="profile-btn" data-profile="pvp">PvP Mode</button>
            <button class="profile-btn" data-profile="raid">Raid Boss</button>
        </div>
    </div>

    <div class="skills-list" id="skillsList"></div>

    <button class="add-skill-btn" id="addSkillBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Добавить скилл в макрос
    </button>

    <div class="total-time" id="totalTimeDisplay">Общее время цикла: 0.0s</div>

    <script src="app.js"></script>
</body>
</html>
